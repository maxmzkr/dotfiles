# Match the gnome-terminal setup that was in dconf:
# font UbuntuMono Nerd Font Mono 12, solarized-light palette, login zsh.

# ── font ─────────────────────────────────────────────────────────────────
font_family       UbuntuMono Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         12.0
# gnome-terminal had bold-is-bright=true — kitty equivalent:
bold_is_bright    yes

# ── shell ────────────────────────────────────────────────────────────────
shell /bin/zsh

# ── window ───────────────────────────────────────────────────────────────
# gnome-terminal had no internal padding; keep it minimal.
window_padding_width 0
# Don't confirm on close of a single window.
confirm_os_window_close 0
# No audible bell, matches default gnome-terminal feel.
enable_audio_bell no

# ── cursor ───────────────────────────────────────────────────────────────
cursor               #000000
cursor_text_color    #fdf6e3
cursor_shape         block
cursor_blink_interval 0

# ── scrollback ───────────────────────────────────────────────────────────
scrollback_lines     10000

# ── colors: solarized light ──────────────────────────────────────────────
# from gnome-terminal palette (16-bit hex collapsed to 8-bit)
foreground           #657b83
background           #fdf6e3
selection_foreground #fdf6e3
selection_background #657b83

# normal
color0  #073642
color1  #dc322f
color2  #859900
color3  #b58900
color4  #268bd2
color5  #d33682
color6  #2aa198
color7  #eee8d5

# bright
color8  #002b36
color9  #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #6c71c4
color14 #93a1a1
color15 #fdf6e3
