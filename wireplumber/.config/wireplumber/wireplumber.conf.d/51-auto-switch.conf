# Auto-switch audio output to Bluetooth headphones on connect, and back off them
# on disconnect. See scripts/sticky-default-node.lua for the selection rules.

wireplumber.settings = {
  # Don't remember the chosen sink/source across restarts; boot on raw priority.
  node.restore-default-targets = false
}

wireplumber.profiles = {
  main = {
    # Both are replaced by script.custom.sticky-default-node below.
    hooks.default-nodes.find-selected = disabled
    hooks.default-nodes.state = disabled

    script.custom.sticky-default-node = required
  }
}

wireplumber.components = [
  {
    name = sticky-default-node.lua, type = script/lua
    provides = script.custom.sticky-default-node
    requires = [ metadata.default ]
  }
]

# Bluetooth sinks default to 1010, barely above the laptop speakers (1009) and
# below the CalDigit dock (1109). Lift them clear of both so headphones always win.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]
