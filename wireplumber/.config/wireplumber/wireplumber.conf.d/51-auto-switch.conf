# Auto-switch audio output to Bluetooth headphones on connect, and back off them
# on disconnect. See scripts/sticky-default-node.lua for the selection rules.

wireplumber.settings = {
  # Don't remember the chosen sink/source across restarts; boot on raw priority.
  node.restore-default-targets = false
}

wireplumber.profiles = {
  main = {
    # Both are replaced by script.custom.sticky-default-node below.
    hooks.default-nodes.find-selected = disabled
    hooks.default-nodes.state = disabled

    script.custom.sticky-default-node = required
  }
}

wireplumber.components = [
  {
    name = sticky-default-node.lua, type = script/lua
    provides = script.custom.sticky-default-node
    requires = [ metadata.default ]
  }
]

# Bluetooth sinks default to 1010, one point above the laptop speakers and the
# CalDigit dock. Observed on 0.4/noble both of those are 1009 — ALSA gives USB and
# PCI analog stereo the same number, so the dock wins on enumeration order, not
# priority. One point is enough to win but not enough to survive anything nudging
# the others, so lift Bluetooth clear of both.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]

# The Brio's IEC958 input is 2008, below both the CalDigit dock input and the
# built-in mic at 2009. Since node.restore-default-targets above throws away the
# saved pick at every boot, raw priority is all that decides the default mic.
# Matched on the vendor/model prefix: the full node.name ends in the unit's serial.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-046d_Brio_501.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2500
      }
    }
  }
]
