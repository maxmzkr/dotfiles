# starship prompt — replaces powerlevel10k.
#
# Shape mirrors the old .p10k.zsh: two lines (path + git on top, prompt char
# below), everything else right-aligned. The old config ran POWERLEVEL9K_MODE=ascii,
# so no glyph here needs a Nerd Font either — plain ASCII only.

add_newline = false

format = """
$directory$git_branch$git_commit$git_state$git_status
$character"""

right_format = """
$status$cmd_duration$jobs$python$nodejs$golang$java$terraform$kubernetes$time"""

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'
vicmd_symbol = '[<](bold green)'

[directory]
style = 'bold cyan'
truncation_length = 4
truncation_symbol = '.../'
read_only = ' ro'

[git_branch]
symbol = ''
format = '[$branch]($style)'
style = 'bold magenta'

[git_status]
format = '([ $all_status$ahead_behind]($style))'
style = 'bold yellow'
conflicted = '~'
ahead = '>${count}'
behind = '<${count}'
diverged = '<>'
untracked = '?${count}'
stashed = '$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '-${count}'

# Off by default in starship; p10k showed the last exit code, so keep it.
[status]
disabled = false
symbol = ''
format = '[$common_meaning$signal_name$maybe_int]($style) '
style = 'bold red'

[cmd_duration]
# p10k's threshold was 3s.
min_time = 3000
format = '[$duration]($style) '
style = 'yellow'

[jobs]
symbol = '&'
format = '[$symbol$number]($style) '

[python]
symbol = 'py '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = 'node '

[golang]
symbol = 'go '

[java]
symbol = 'java '

[terraform]
symbol = 'tf '

# Off by default. Unlike p10k there is no show-on-command option, so the
# current context is on every prompt whenever a kubeconfig context is set.
# Scope it with detect_files/detect_folders if that gets noisy.
[kubernetes]
disabled = false
symbol = 'k8s '
format = '[$symbol$context( \($namespace\))]($style) '
style = 'bold blue'

# Full GKE context names (gke_<project>_<region>_<cluster>) are too long for a
# right prompt; show just the cluster.
[[kubernetes.contexts]]
context_pattern = 'gke_.*_(?P<var_cluster>[\w-]+)'
context_alias = '$var_cluster'

# Off by default; p10k had a clock on the right.
[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time]($style)'
style = 'bold white'
